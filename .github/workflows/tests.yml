name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      # The full EXFOR database is several GB and is not available here, so the
      # database-backed tests are skipped. x4i3 ships a 2023 snapshot, which is enough
      # for the library to import and for the offline tests to run.
      - name: Test
        run: uv run pytest tests/ -q -m "not slow"

      - name: Install poppler for PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check the corpus tables still parse from the supplement
        run: |
          uv run python scripts/extract_corpus_tables.py --outdir /tmp/spec-check
          diff -r spec /tmp/spec-check --exclude=known_missing.csv
