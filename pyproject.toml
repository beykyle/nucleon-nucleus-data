[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nn-corpora"
version = "0.1.0"
description = "Curation of nucleon-nucleus scattering data corpora (ELM, KDUQ, CHUQ, Test) from EXFOR"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Beyer" }]
dependencies = [
    "exfor-tools",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "periodictable>=1.6",
    "x4i3>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # jitr is NOT a curation dependency. It is installed for tests only, to check
    # that src/nn_corpora/kinematics.py reproduces the Rutherford cross section and
    # kinematics that rxmc uses downstream. See tests/test_kinematics.py.
    "jitr>=2.5",
    "nbmake>=1.5",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "black>=24.0",
]

[tool.uv.sources]
exfor-tools = { path = "external/exfor_tools", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nn_corpora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that query the EXFOR database",
]
